<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e1116">
  <link rel="icon" href="data:,">
  <title>Controle remoto de bancada</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="barra">
    <span id="estado-conexao" class="selo-conexao">Desconectado</span>
    <button id="botao-conectar" class="botao-barra" type="button">Conectar</button>
    <button id="botao-ajustes" class="botao-barra botao-icone" type="button" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
      </svg>
    </button>
  </header>

  <main class="principal">
    <p id="aviso" class="aviso" role="status"></p>

    <section class="leituras" aria-label="Leituras">
      <table class="tabela-leituras">
        <thead>
          <tr>
            <th scope="col"><span class="visualmente-oculto">Origem</span></th>
            <th scope="col">Roll</th>
            <th scope="col">Pitch</th>
            <th scope="col">Yaw</th>
            <th scope="col">Throttle</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Comando</th>
            <td id="cmd-roll">—</td>
            <td id="cmd-pitch">—</td>
            <td id="cmd-yaw">—</td>
            <td id="cmd-throttle">—</td>
          </tr>
          <tr class="linha-medido">
            <th scope="row">Medido</th>
            <td id="med-roll">—</td>
            <td id="med-pitch">—</td>
            <td id="med-yaw">—</td>
            <td id="med-throttle">—</td>
          </tr>
        </tbody>
      </table>
      <p class="firmware">Firmware: <span id="estado-firmware">sem telemetria</span></p>
    </section>

    <section class="controles" aria-label="Controles de voo">
      <div class="area-joystick">
        <div id="joystick-esquerdo" class="joystick joystick-acelerador" aria-label="Throttle e yaw">
          <span class="rotulo-controle rotulo-cima">Throttle</span>
          <span class="rotulo-controle rotulo-lado">Yaw</span>
          <div class="pino"></div>
        </div>
      </div>

      <div class="area-joystick">
        <div id="joystick-direito" class="joystick" aria-label="Pitch e roll">
          <span class="rotulo-controle rotulo-cima">Pitch</span>
          <span class="rotulo-controle rotulo-lado">Roll</span>
          <div class="pino"></div>
        </div>
      </div>
    </section>

    <details id="debug" class="debug">
      <summary>Debug</summary>
      <dl class="debug-campos">
        <dt>Último pacote</dt>
        <dd id="dbg-pacote" class="debug-pacote">—</dd>
        <dt>Taxa</dt>
        <dd id="dbg-taxa">—</dd>
        <dt>Contadores</dt>
        <dd id="dbg-contadores">—</dd>
        <dt>Tela acesa</dt>
        <dd id="dbg-trava">—</dd>
        <dt>Último desarme</dt>
        <dd id="dbg-desarme">—</dd>
      </dl>
    </details>
  </main>

  <footer class="acoes">
    <button id="botao-armar" class="botao-armar indisponivel" type="button">Segure para ARMAR</button>
    <button id="botao-parar" class="botao-parar" type="button">PARAR</button>
  </footer>

  <section id="ajustes" class="ajustes" aria-label="Ajustes" hidden>
    <form id="form-ajustes" class="form-ajustes">
      <h1 class="ajustes-titulo">Ajustes</h1>

      <fieldset>
        <legend>Bluetooth</legend>
        <label class="campo">
          <span>UUID do serviço</span>
          <input type="text" name="uuidServico" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </label>
        <label class="campo">
          <span>UUID da característica</span>
          <input type="text" name="uuidCaracteristica" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </label>
        <label class="campo campo-marcar">
          <input type="checkbox" name="mostrarTodosDispositivos">
          <span>Mostrar todos os dispositivos no seletor</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Limites</legend>
        <label class="campo">
          <span>Taxa de envio (Hz)</span>
          <input type="number" name="taxaHz" min="5" max="50" step="1" inputmode="numeric">
        </label>
        <label class="campo">
          <span>Ângulo máximo de roll/pitch (°)</span>
          <input type="number" name="anguloMaxGraus" min="1" max="30" step="any" inputmode="decimal">
        </label>
        <label class="campo">
          <span>Modo do yaw</span>
          <select name="yawModo">
            <option value="taxa">Taxa (°/s)</option>
            <option value="angulo">Ângulo (°)</option>
          </select>
        </label>
        <label class="campo">
          <span>Taxa máxima de yaw (°/s)</span>
          <input type="number" name="yawTaxaMaxGps" min="1" max="180" step="any" inputmode="decimal">
        </label>
        <label class="campo">
          <span>Teto do throttle (%)</span>
          <input type="number" name="tetoThrottlePct" min="0" max="100" step="any" inputmode="decimal">
        </label>
      </fieldset>

      <fieldset>
        <legend>Sentido dos eixos</legend>
        <label class="campo campo-marcar">
          <input type="checkbox" name="inverterRoll">
          <span>Inverter roll</span>
        </label>
        <label class="campo campo-marcar">
          <input type="checkbox" name="inverterPitch">
          <span>Inverter pitch</span>
        </label>
        <label class="campo campo-marcar">
          <input type="checkbox" name="inverterYaw">
          <span>Inverter yaw</span>
        </label>
      </fieldset>

      <div class="ajustes-acoes">
        <button id="botao-fechar-ajustes" class="botao-secundario" type="button">Fechar</button>
        <button id="botao-padrao" class="botao-secundario" type="button">Restaurar padrão</button>
        <button class="botao-primario" type="submit">Salvar</button>
      </div>
    </form>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
